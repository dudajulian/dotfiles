#### General ####

set -g mouse on
set -g history-limit 100000
set -sg escape-time 10

# Number windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1

# Close numbering gaps after deleting windows
set -g renumber-windows on

# New windows and panes inherit the current directory
bind c new-windows -c "#{pane_current_path}"
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-winow -v -c "#{pane_current_path}"

#### Vim-style copy mode ####
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard" # Linux

#### TPM plugins ####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

#Keep this at the bottom
run '~/.tmux/plugins/tpm/tpm'

